[project]
name = "network-path-diagnostics"
description = "Windows desktop multi-target ping monitoring tool."
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "PySide6==6.12.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "cyclonedx-bom==7.6.0",
    "cyclonedx-python-lib==11.12.0",
    "lxml==6.1.3",
    "pip-audit==2.10.1",
    "pyinstaller==6.22.3",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
