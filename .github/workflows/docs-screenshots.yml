name: Documentation screenshots

on:
  workflow_dispatch:
  push:
    branches: ["main", "codex/usage-evidence-20260908"]
    paths:
      - "scripts/render_docs_screenshots.py"
      - "app/**"
      - ".github/workflows/docs-screenshots.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install existing locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Render actual Qt widgets and verify synthetic CSV replay
        run: python scripts/render_docs_screenshots.py --output-dir artifacts/docs-images
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-documentation-${{ github.sha }}
          path: artifacts/docs-images/
          if-no-files-found: error
          retention-days: 1
