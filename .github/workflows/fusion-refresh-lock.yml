name: Fusion dev lock refresh (one-shot)

on:
  push:
    branches: [feature/fusion-dashboard-v0.4]
    paths: [.github/workflows/fusion-refresh-lock.yml]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'sebia1993/multi-target-ping-monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned lock resolver
        run: python -m pip install 'uv==0.13.9'
      - name: Generate universal, hash-locked development dependencies
        run: uv pip compile --universal --python-version 3.12 --generate-hashes --output-file requirements-dev.lock requirements-dev.in
      - name: Install and audit the generated lock before publishing
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip_audit -r requirements-dev.lock --require-hashes --progress-spinner=off
          python -m pip_audit -r requirements.lock --require-hashes --progress-spinner=off
      - name: Publish lock only to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements-dev.lock
          if git diff --cached --quiet; then
            echo 'Lock already current.'
            exit 0
          fi
          git commit -m 'security(fusion): refresh audited development hash lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"
