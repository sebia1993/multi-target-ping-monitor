name: Fusion Qt 50 target acceptance

on:
  push:
    branches: [feature/fusion-dashboard-v0.4]
    paths:
      - '.github/workflows/fusion-ui50-validation.yml'

permissions:
  contents: read

jobs:
  fusion-ui50-smoke:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install audited hash-pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run actual Fusion Qt UI50 simulated 30s acceptance
        shell: pwsh
        run: |
          python scripts/soak_test.py --profile ui50 --ui-implementation fusion --duration-seconds 30 --output-dir artifacts/fusion-ui50
          if ($LASTEXITCODE -ne 0) { throw "Fusion UI50 failed 0.2s event/process limits" }
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fusion-ui50-smoke-${{ github.run_id }}
          path: artifacts/fusion-ui50/**
          if-no-files-found: ignore
          retention-days: 1
