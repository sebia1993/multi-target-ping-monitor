name: Manual Stability Soak
# Every third-party action is pinned to the reviewed Node 24 generation commit SHA.

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Space-separated soak profiles, for example: release ui10"
        required: true
        default: "release"
      runner_mode:
        description: "Use GitHub-hosted Windows for short checks, or a self-hosted Windows runner for 8h/24h runs."
        required: true
        type: choice
        default: "github-hosted-windows"
        options:
          - github-hosted-windows
          - self-hosted-windows
      run_id:
        description: "Optional stable run id. Leave empty to use the current timestamp."
        required: false
        default: ""
      override_duration_seconds:
        description: "Smoke-only override. Leave empty for real evidence."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: stability-soak-${{ github.ref }}-${{ inputs.runner_mode }}
  cancel-in-progress: false

jobs:
  github_hosted_windows:
    if: ${{ inputs.runner_mode == 'github-hosted-windows' }}
    name: GitHub-hosted Windows soak
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run stability soak suite
        id: soak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profiles = "${{ inputs.profiles }}" -split '\s+' | Where-Object { $_ }
          if (-not $profiles) {
            throw 'profiles input is empty'
          }
          $selfHostedOnlyProfiles = @('long8h', 'long24h')
          $selfHostedOnlyRequested = @($profiles | Where-Object { $selfHostedOnlyProfiles -contains $_ })
          if ($selfHostedOnlyRequested) {
            throw "profiles '$($selfHostedOnlyRequested -join ' ')' require runner_mode=self-hosted-windows because GitHub-hosted Windows is limited by timeout-minutes: 360."
          }
          $runId = "${{ inputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = Get-Date -Format 'yyyyMMdd_HHmmss'
          }
          $argsList = @(
            'scripts\run_stability_soak_suite.py',
            '--run-id',
            $runId,
            '--output-dir',
            'artifacts\stability_soak_suite',
            '--evidence-report',
            '--evidence-report-path',
            "artifacts\stability_soak_suite\$runId\stability_soak_evidence.json",
            '--profiles'
          ) + $profiles
          $override = "${{ inputs.override_duration_seconds }}"
          if (-not [string]::IsNullOrWhiteSpace($override)) {
            $fixedEvidenceProfiles = @('long4h', 'long8h', 'long24h')
            if (@($profiles | Where-Object { $fixedEvidenceProfiles -contains $_ })) {
              throw 'long4h/long8h/long24h are fixed-duration evidence profiles and cannot use an override.'
            }
            $argsList += @('--override-duration-seconds', $override)
          }
          python @argsList
          $soakExitCode = $LASTEXITCODE
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          if ($soakExitCode -ne 0) { throw "stability soak evidence gate failed" }

      - name: Write run summary
        if: always()
        shell: pwsh
        run: |
          $runId = "${{ steps.soak.outputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "${{ inputs.run_id }}"
          }
          $manifest = "artifacts\stability_soak_suite\$runId\stability_soak_suite.json"
          if (-not (Test-Path $manifest)) {
            Add-Content $env:GITHUB_STEP_SUMMARY "No stability soak manifest was created."
            exit 0
          }
          $payload = Get-Content $manifest -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY "# Stability Soak"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Run ID: ``$runId``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Passed: ``$($payload.passed)``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Profiles: ``$($payload.profiles_requested -join ' ')``"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Profile | Status | Duration | Due Lateness | Targets Probed | Min Starts | Overlap | Pending | Handles Growth | Resume | Loader Ownership | Memory Growth |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- | ---: |"
          foreach ($result in $payload.results) {
            $summaryPath = if ($result.summary_json -and [IO.Path]::IsPathRooted($result.summary_json)) {
              $result.summary_json
            } elseif ($result.summary_json) {
              Join-Path (Split-Path $manifest -Parent) $result.summary_json
            } else { $null }
            $summary = if ($summaryPath -and (Test-Path $summaryPath)) { Get-Content $summaryPath -Raw | ConvertFrom-Json } else { $null }
            Add-Content $env:GITHUB_STEP_SUMMARY "| $($result.profile) | $($result.status) | $($summary.duration_seconds) | $($summary.cadence_max_abs_grid_drift_seconds) | $($summary.probe_target_count) | $($summary.probe_min_starts_per_target) | $($summary.max_same_target_overlap) | $($summary.max_pending_ping_count) | $($summary.process_handle_growth) | $($summary.session_resume_verified) | $($summary.session_loader_reserved_before_cleanup)/$($summary.session_loader_released_after_cleanup) | $($summary.memory_growth_bytes) |"
          }

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-soak-${{ github.run_id }}-${{ inputs.runner_mode }}
          path: artifacts/stability_soak_suite
          if-no-files-found: warn

  self_hosted_windows:
    if: ${{ inputs.runner_mode == 'self-hosted-windows' }}
    name: Self-hosted Windows soak
    runs-on: [self-hosted, Windows]
    timeout-minutes: 1500
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run stability soak suite
        id: soak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profiles = "${{ inputs.profiles }}" -split '\s+' | Where-Object { $_ }
          if (-not $profiles) {
            throw 'profiles input is empty'
          }
          $runId = "${{ inputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = Get-Date -Format 'yyyyMMdd_HHmmss'
          }
          $argsList = @(
            'scripts\run_stability_soak_suite.py',
            '--run-id',
            $runId,
            '--output-dir',
            'artifacts\stability_soak_suite',
            '--evidence-report',
            '--evidence-report-path',
            "artifacts\stability_soak_suite\$runId\stability_soak_evidence.json",
            '--profiles'
          ) + $profiles
          $override = "${{ inputs.override_duration_seconds }}"
          if (-not [string]::IsNullOrWhiteSpace($override)) {
            $fixedEvidenceProfiles = @('long4h', 'long8h', 'long24h')
            if (@($profiles | Where-Object { $fixedEvidenceProfiles -contains $_ })) {
              throw 'long4h/long8h/long24h are fixed-duration evidence profiles and cannot use an override.'
            }
            $argsList += @('--override-duration-seconds', $override)
          }
          python @argsList
          $soakExitCode = $LASTEXITCODE
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          if ($soakExitCode -ne 0) { throw "stability soak evidence gate failed" }

      - name: Write run summary
        if: always()
        shell: pwsh
        run: |
          $runId = "${{ steps.soak.outputs.run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "${{ inputs.run_id }}"
          }
          $manifest = "artifacts\stability_soak_suite\$runId\stability_soak_suite.json"
          if (-not (Test-Path $manifest)) {
            Add-Content $env:GITHUB_STEP_SUMMARY "No stability soak manifest was created."
            exit 0
          }
          $payload = Get-Content $manifest -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY "# Stability Soak"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Run ID: ``$runId``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Passed: ``$($payload.passed)``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Profiles: ``$($payload.profiles_requested -join ' ')``"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Profile | Status | Duration | Due Lateness | Targets Probed | Min Starts | Overlap | Pending | Handles Growth | Resume | Loader Ownership | Memory Growth |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- | ---: |"
          foreach ($result in $payload.results) {
            $summaryPath = if ($result.summary_json -and [IO.Path]::IsPathRooted($result.summary_json)) {
              $result.summary_json
            } elseif ($result.summary_json) {
              Join-Path (Split-Path $manifest -Parent) $result.summary_json
            } else { $null }
            $summary = if ($summaryPath -and (Test-Path $summaryPath)) { Get-Content $summaryPath -Raw | ConvertFrom-Json } else { $null }
            Add-Content $env:GITHUB_STEP_SUMMARY "| $($result.profile) | $($result.status) | $($summary.duration_seconds) | $($summary.cadence_max_abs_grid_drift_seconds) | $($summary.probe_target_count) | $($summary.probe_min_starts_per_target) | $($summary.max_same_target_overlap) | $($summary.max_pending_ping_count) | $($summary.process_handle_growth) | $($summary.session_resume_verified) | $($summary.session_loader_reserved_before_cleanup)/$($summary.session_loader_released_after_cleanup) | $($summary.memory_growth_bytes) |"
          }

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-soak-${{ github.run_id }}-${{ inputs.runner_mode }}
          path: artifacts/stability_soak_suite
          if-no-files-found: warn
